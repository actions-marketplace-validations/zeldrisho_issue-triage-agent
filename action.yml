name: "Issue Triage Agent"
description: "AI-powered GitHub Issue triage: classify, label, detect duplicates, and reply"
author: "zeldrisho"

branding:
  icon: "zap"
  color: "purple"

inputs:
  github-token:
    description: "GitHub token for API access"
    required: false
    default: "${{ github.token }}"
  anthropic-api-key:
    description: "Anthropic API key for Claude"
    required: false
  openai-api-key:
    description: "OpenAI API key"
    required: false
  llm-provider:
    description: "LLM provider to use (anthropic or openai); overrides repository configuration"
    required: false
  llm-model:
    description: "LLM model identifier; overrides repository configuration"
    required: false
  llm-base-url:
    description: "Custom base URL for LLM API (applies to the selected provider)"
    required: false
  bot-login:
    description: "GitHub login that posts Action replies, used to detect reruns"
    required: false
    default: "github-actions[bot]"
  config-path:
    description: "Path to the config YAML file in the repo"
    required: false
    default: ".github/issue-triage-agent.yml"

outputs:
  category:
    description: "Classified issue category (issues events only)"
  priority:
    description: "Classified issue priority (issues events only)"
  labels-applied:
    description: "Comma-separated list of applied labels (issues events only)"
  reply-posted:
    description: "Whether a reply comment was posted (issues events only)"
  triage-report:
    description: "JSON report of classification, labels, labeling and reply status, and step errors (issues events only)"

runs:
  using: "node24"
  main: "dist/main.mjs"
